name: Ruby Rails Journey — build & deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "embed.html"
      - "styles.css"
      - "data.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install + build
        run: |
          npm ci
          npm run build
        working-directory: .

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
